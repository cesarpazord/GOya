
name: CI Hola Mundo

on:
  push:
    branches:
      - main
      - master
      - CRM
      - SCM
      - ERP

  pull_request:
    branches:
      - main
      - master

jobs:
  smoke-test:
    name: Prueba básica del pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Verificar que GitHub Actions funciona
        run: echo "Hola Mundo desde GitHub Actions"

      - name: Ejecutar prueba de aserción
        shell: bash
        run: |
          RESULT="hola"

          if [ "$RESULT" = "hola" ]; then
            echo "Test superado exitosamente."
          else
            echo "Test fallido."
            exit 1
          fi
